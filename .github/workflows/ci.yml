name: Formula CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
    name: brew test ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Check out tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install and test formula
        run: |
          brew tap nyldn/tap "$GITHUB_WORKSPACE"
          brew trust --formula nyldn/tap/ai-env-optimizer
          brew audit --strict --online nyldn/tap/ai-env-optimizer
          brew install nyldn/tap/ai-optimizer
          test "$(brew list --formula | grep -c '^ai-env-optimizer$')" -eq 1
          brew test nyldn/tap/ai-env-optimizer
          brew services info nyldn/tap/ai-env-optimizer --json | ruby -rjson -e '
            service = JSON.parse($stdin.read).fetch(0)
            abort "formula service is not schedulable" unless service.fetch("schedulable")
            abort "service was started during CI" if service.fetch("running") || service.fetch("loaded")
          '
